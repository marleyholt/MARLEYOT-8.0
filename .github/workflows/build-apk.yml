name: Build OTCv8 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Build Android APK with MSBuild
      run: |
        cd client-mobile/android/otclientv8
        Get-ChildItem
        msbuild /p:Configuration=Release /p:Platform=ARM64 otclientv8.androidproj

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: otcv8-android-apk
        path: |
          client-mobile/android/otclientv8/**/*.apk
          client-mobile/android/**/*.apk
